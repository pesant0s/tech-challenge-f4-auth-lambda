name: CI/CD

# Testes e empacotamento sempre; publicação só com AMBIENTE_ATIVO=true (ADR-013).
# Contrato: tech-challenge-f4-plataforma/docs/infraestrutura/contrato.md.
on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  AWS_REGION: us-east-1
  TF_VERSION: "1.17.1"
  PREFIXO_SSM: /tech-challenge-f4

permissions:
  contents: read

jobs:
  testes:
    name: Testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: pytest --cov=src --cov-report=term-missing --cov-report=xml --cov-fail-under=80 -q
      - uses: actions/upload-artifact@v4
        with:
          name: cobertura
          path: coverage.xml

  qualidade:
    name: Qualidade (SonarQube Cloud)
    needs: testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: cobertura
      - uses: SonarSource/sonarqube-scan-action@4d1dc0c91ee400dcf8a6dddf2f705ac36542e304 # v8.4.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  empacotar:
    name: Empacotar e validar o zip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: make build

      # A Lambda importa a partir da raiz do zip: pega dependência ou metadado faltando antes do deploy.
      - name: Verificar que o pacote é importável
        run: |
          unzip -qo dist/lambda.zip -d /tmp/verifica
          cd /tmp/verifica
          python -c "
          import json, handler
          r = handler.handler({'body': json.dumps({'cpf': '11111111111'})}, None)
          assert r['statusCode'] == 400, r
          "

  ambiente-desligado:
    name: Publicação não executada
    needs: [testes, empacotar]
    if: github.ref_name == 'main' && github.event_name != 'pull_request' && vars.AMBIENTE_ATIVO != 'true'
    runs-on: ubuntu-latest
    steps:
      - run: echo "### Publicação pulada — AMBIENTE_ATIVO não está true, o ambiente AWS está desligado." >> "$GITHUB_STEP_SUMMARY"

  publicar:
    name: Publicar na AWS
    needs: [testes, empacotar]
    if: github.ref_name == 'main' && github.event_name != 'pull_request' && vars.AMBIENTE_ATIVO == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      TEM_ROLE: ${{ secrets.AWS_ROLE_ARN != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: ${{ env.TF_VERSION }}

      # Conta comum: OIDC. Laboratório (AWS Academy): credenciais da sessão.
      - name: Autenticar na AWS via OIDC
        if: env.TEM_ROLE == 'true'
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Autenticar na AWS com as credenciais da sessão
        if: env.TEM_ROLE != 'true'
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - run: make build

      - name: Terraform apply
        working-directory: infra
        run: |
          terraform init -input=false \
            -backend-config="bucket=tech-challenge-f4-tfstate-$(aws sts get-caller-identity --query Account --output text)" \
            -backend-config="region=$AWS_REGION"
          terraform apply -input=false -auto-approve

      # Um CPF sabidamente inválido tem que voltar 400; um 5xx indica problema de VPC, segredo ou pacote.
      - name: Teste de fumaça
        run: |
          ENDPOINT=$(aws ssm get-parameter --name "$PREFIXO_SSM/apigateway/endpoint" --query Parameter.Value --output text)
          for _ in $(seq 1 6); do
            STATUS=$(curl -s -o /tmp/resposta.json -w "%{http_code}" -X POST "$ENDPOINT/auth/cpf" \
              -H 'content-type: application/json' -d '{"cpf":"11111111111"}')
            [ "$STATUS" = "400" ] && break
            sleep 10
          done
          cat /tmp/resposta.json
          test "$STATUS" = "400"
